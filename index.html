<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Pixel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="icone">
      <a href="acessórios.html">

      <a href="contato.html">
        <img src="contato.png" alt="Contato">
      </a>

    </div>

    <div class="icone">
      <a href="sobre.html">
        <img src="sobre.png" alt="Sobre Nós">
